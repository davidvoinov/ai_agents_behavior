# Free-stage configuration for the four core Berg trust-game experiments.

model_source:
  file: configs/berg/models_free.yaml

models:
  - gpt_oss_20b_groq
  - gpt_oss_120b_cerebras
  - llama_groq
  - qwen_groq
  - mistral_small

reference_model: gpt_oss_20b_groq

sample:
  n_pairs_per_cell: 10

generation:
  temperature: 1.0
  max_tokens: 1200
  communication_rounds: 2

cross_model:
  strategy: ordered_against_reference
  include_all_ordered_pairs: false

output:
  directory: data/berg/raw
  prefix: free_full_berg

experiments:
  - id: experiment_1a_same_no_communication
    enabled: true
    pairing: same_model
    communication: false

  - id: experiment_1b_cross_no_communication
    enabled: true
    pairing: cross_model
    communication: false

  - id: experiment_2a_same_communication
    enabled: true
    pairing: same_model
    communication: true

  - id: experiment_2b_cross_communication
    enabled: true
    pairing: cross_model
    communication: true
