# Free and accessible model candidates for pilot runs.
#
# This file separates provider, provider-specific model ID, and model family.
# The scientific analysis should compare model families, not providers alone.

models:
  - name: gpt_oss_20b_groq
    analysis_label: GPT-OSS via Groq
    status: baseline
    access: free_or_existing
    provider: groq
    model_family: GPT-OSS
    model_id: openai/gpt-oss-20b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    notes: Existing baseline model used in earlier runs.

  - name: gpt_oss_120b_cerebras
    analysis_label: GPT-OSS via Cerebras
    status: baseline
    access: free_or_existing
    provider: cerebras
    model_family: GPT-OSS
    model_id: gpt-oss-120b
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    notes: Existing baseline model used in earlier runs.

  - name: gpt_oss_20b_openrouter_free
    analysis_label: GPT-OSS via OpenRouter
    status: pilot
    access: free
    provider: openrouter
    model_family: GPT-OSS
    model_id: openai/gpt-oss-20b:free
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    notes: Free OpenRouter route; availability and rate limits should be checked before running.

  - name: llama_groq
    analysis_label: Llama via Groq
    status: pilot
    access: free_or_low_cost
    provider: groq
    model_family: Llama
    model_id: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    notes: Available from Groq model list at pilot setup.

  - name: llama_openrouter_free
    analysis_label: Llama via OpenRouter
    status: pilot
    access: free_if_available
    provider: openrouter
    model_family: Llama
    model_id: null
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    notes: Fill in a currently available free Llama route if OpenRouter exposes one.

  - name: qwen_groq
    analysis_label: Qwen via Groq
    status: pilot
    access: free_or_low_cost
    provider: groq
    model_family: Qwen
    model_id: qwen/qwen3-32b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    prompt_prefix: /no_think
    response_normalization:
      - strip_leading_think_block
      - unwrap_json_code_fence
    notes: Available from Groq model list at pilot setup.

  - name: qwen_openrouter_free
    analysis_label: Qwen via OpenRouter
    status: pilot
    access: free_if_available
    provider: openrouter
    model_family: Qwen
    model_id: null
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    prompt_prefix: /no_think
    response_normalization:
      - strip_leading_think_block
      - unwrap_json_code_fence
    notes: Fill in a currently available free Qwen route if OpenRouter exposes one.

  - name: gemini_free_tier
    analysis_label: Gemini via Google
    status: pilot
    access: free_tier
    provider: google
    model_family: Gemini
    model_id: gemini-2.5-flash-lite
    base_url: null
    api_key_env: GOOGLE_API_KEY
    provider_type: gemini_rest
    min_call_interval: 8.0
    response_normalization:
      - unwrap_json_code_fence
    notes: Google Gemini free-tier model verified by smoke test.

  - name: mistral_small
    analysis_label: Mistral Small via Mistral
    status: pilot
    access: free_or_low_cost
    provider: mistral
    model_family: Mistral
    model_id: mistral-small-latest
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    provider_type: openai_compatible
    response_normalization:
      - unwrap_json_code_fence
    notes: Mistral API model verified by smoke test.

  - name: deepseek_huggingface
    analysis_label: DeepSeek via Hugging Face
    status: pilot
    access: free_or_low_cost
    provider: huggingface
    model_family: DeepSeek
    model_id: deepseek-ai/DeepSeek-V4-Flash
    base_url: https://router.huggingface.co/v1
    api_key_env: HUGGINGFACE_API_KEY
    provider_type: openai_compatible
    response_normalization:
      - strip_leading_think_block
      - unwrap_json_code_fence
    notes: DeepSeek direct API had insufficient balance; Hugging Face route verified by smoke test.

  - name: openrouter_free_model
    analysis_label: Selected free model via OpenRouter
    status: pilot
    access: free
    provider: openrouter
    model_family: OpenRouter-Free
    model_id: null
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    notes: Generic placeholder for a free OpenRouter model selected immediately before the pilot.

metadata:
  comparison_unit: model_family
  provider_role: recorded_as_access_platform
  pricing_snapshot_date: null
  notes: Update exact model IDs and access status immediately before running pilot experiments.
